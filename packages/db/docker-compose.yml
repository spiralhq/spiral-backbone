name: spiral-backbone

services:
  postgres:
    image: postgres:18
    container_name: spiral-backbone-postgres
    environment:
      POSTGRES_DB: spiral-backbone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - spiral-backbone_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  spiral-backbone_postgres_data:
