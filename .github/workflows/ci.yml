name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      # These end-to-end suites need a sibling spiral-programs checkout with `anchor build`
      # already run, plus the solana-keygen CLI, Surfpool and Docker. spiral-programs is a
      # private repo and adding a cross-repo checkout would need a new PAT/deploy-key secret,
      # so they skip themselves here with a console message instead of failing:
      #   packages/cli/src/e2e/submit-fetch-verify.test.ts
      #   packages/indexer/src/e2e/backfill-surfpool.test.ts
      #   packages/eval/src/testing/chain.test.ts
      #   packages/eval/src/h1/h1.e2e.test.ts
      #   packages/eval/src/h2/h2.e2e.test.ts
      #   packages/eval/src/h2/executor/executor.e2e.test.ts
      #   packages/eval/src/h3/h3.e2e.test.ts
      #   packages/eval/src/h4/h4.e2e.test.ts
      #   packages/eval/src/campaign/preflight.e2e.test.ts
      #   packages/eval/src/campaign/chain-checks.e2e.test.ts
      # A green CI run therefore does not cover them: run `SPIRAL_E2E=required npm run test` on a
      # workstation with both repos built (docs/campaign-runbook.md, section 0).
      # Also feeds the COPY --from=ipfs/kubo:v0.43.1 in scripts/kubo-node-control.test.ts's
      # fixture image (scripts/fixtures/kubo-node-control-test/Dockerfile).
      - run: docker pull ipfs/kubo:v0.43.1
      # Warms the cache for scripts/kubo-node-control.test.ts's systemd-in-Docker
      # image build, which otherwise pays a cold ubuntu:24.04 pull + full
      # apt-get install inside its 120s beforeAll timeout budget.
      - run: docker pull ubuntu:24.04
      # packages/db and packages/indexer tests start ephemeral postgres:18 containers.
      - run: docker pull postgres:18
      - run: npm run build
      - run: npm run check-types
      - run: npm run check:ci
      - run: npm run test
